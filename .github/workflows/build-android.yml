name: Build Android APK

# AndroidForge: build the selected source ZIP using a compatible toolchain.
# Fixed: AGP 8.8.x requires Gradle 8.10.2 (system Gradle 8.9 is too old).

on:
  workflow_dispatch:
    inputs:
      zip_source:
        description: "Where should the workflow get the source ZIP from?"
        type: choice
        required: true
        default: input-directory
        options:
          - input-directory
          - download-url
          - release-asset
      zip_path:
        description: "Exact path to source ZIP in input/, for example input/web-build-123-project.zip"
        type: string
        required: false
        default: ""
      zip_url:
        description: "Direct ZIP download URL (only with download-url)"
        type: string
        required: false
        default: ""
      release_tag:
        description: "Release tag containing the source ZIP (only with release-asset)"
        type: string
        required: false
        default: ""
      build_variant:
        description: Build variant
        type: choice
        required: true
        default: auto
        options:
          - auto
          - debug
          - release
          - bundle
      enable_ndk:
        description: "Install NDK even when not detected"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write
  packages: read

concurrency:
  group: androidforge-build-${{ github.ref }}-${{ github.event.inputs.zip_source || 'auto' }}
  cancel-in-progress: false

env:
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=false"
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    container: ghcr.io/professional-x/androidforge-build-env:latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip --quiet
          python3 -m pip install -r scripts/requirements.txt --quiet

      - name: Acquire source ZIP
        id: acquire
        run: |
          python3 scripts/acquire_zip.py \
            --source "${{ inputs.zip_source || 'input-directory' }}" \
            --url "${{ inputs.zip_url }}" \
            --tag "${{ inputs.release_tag }}" \
            --path "${{ inputs.zip_path }}"

      - name: Extract source ZIP
        id: extract
        run: python3 scripts/extract_zip.py --zip "${{ steps.acquire.outputs.zip_path }}"

      - name: Detect project type
        id: detect
        run: |
          python3 scripts/detect_project.py \
            --root "${{ steps.extract.outputs.project_root }}" \
            --output detection.json
          cat detection.json

      - name: Configure toolchain
        id: toolchain
        run: |
          python3 scripts/setup_environment.py \
            --root "${{ steps.extract.outputs.project_root }}" \
            --detect detection.json \
            --android-sdk "$ANDROID_HOME" \
            --output toolchain.json
          cat toolchain.json

      - name: Self-heal project
        id: self_heal
        run: |
          python3 scripts/self_heal.py \
            --root "${{ steps.extract.outputs.project_root }}" \
            --detect detection.json \
            --toolchain toolchain.json \
            --android-sdk "$ANDROID_HOME" \
            --output self_heal.json
          cat self_heal.json

      - name: Switch to project JDK
        run: |
          case "${{ steps.toolchain.outputs.jdk_version }}" in
            8)  NEW_JH=/usr/lib/jvm/java-8-openjdk-amd64 ;;
            11) NEW_JH=/usr/lib/jvm/java-11-openjdk-amd64 ;;
            17|21|*) NEW_JH=/usr/lib/jvm/java-17-openjdk-amd64 ;;
          esac
          echo "JAVA_HOME=$NEW_JH" >> "$GITHUB_ENV"
          echo "$NEW_JH/bin" >> "$GITHUB_PATH"
          "$NEW_JH/bin/java" -version

      - name: Install missing Android SDK components
        run: |
          NEEDS_NDK="${{ steps.toolchain.outputs.needs_ndk }}"
          NDK_VER="${{ steps.toolchain.outputs.ndk_version }}"
          COMPILE_SDK=$(python3 -c 'import json; d=json.load(open("detection.json")); print(d.get("versions",{}).get("compile_sdk") or "")')
          if [ -n "$COMPILE_SDK" ] && [ ! -d "$ANDROID_HOME/platforms/android-$COMPILE_SDK" ]; then
            echo "Installing Android platform $COMPILE_SDK"
            yes | sdkmanager "platforms;android-$COMPILE_SDK" || true
          fi
          yes | sdkmanager "platform-tools" >/dev/null 2>&1 || true
          if [ "$NEEDS_NDK" = "true" ] || [ "${{ inputs.enable_ndk }}" = "true" ]; then
            if [ -n "$NDK_VER" ] && [ ! -d "$ANDROID_HOME/ndk/$NDK_VER" ]; then
              yes | sdkmanager "ndk;$NDK_VER" || true
            fi
            yes | sdkmanager "cmake;3.22.1" >/dev/null 2>&1 || true
          fi

      - name: Switch Flutter version if needed
        if: steps.toolchain.outputs.needs_flutter == 'true'
        run: |
          DETECTED="${{ steps.toolchain.outputs.flutter_version }}"
          CURRENT=$(flutter --version | head -1 | awk '{print $4}')
          if [ -n "$DETECTED" ] && [ "$DETECTED" != "$CURRENT" ]; then
            flutter downgrade "$DETECTED" 2>/dev/null || flutter --version "$DETECTED" 2>/dev/null || true
          fi
          flutter config --enable-linux-desktop --enable-windows-desktop --enable-macos-desktop || true

      - name: Restore Gradle cache
        if: steps.toolchain.outputs.needs_gradle == 'true'
        uses: actions/cache@v4
        with:
          path: |
            /root/.gradle/caches
            /root/.gradle/wrapper
            ${{ steps.extract.outputs.project_root }}/.gradle
          key: gradle-${{ steps.toolchain.outputs.gradle_version }}-${{ hashFiles('**/build.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ steps.toolchain.outputs.gradle_version }}-
            gradle-

      - name: Restore Flutter cache
        if: steps.toolchain.outputs.needs_flutter == 'true'
        uses: actions/cache@v4
        with:
          path: /root/.pub-cache
          key: flutter-pub-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
          restore-keys: |
            flutter-pub-

      # The system image has Gradle 8.9. For newer AGP projects, this
      # downloads the minimum compatible Gradle and puts it first on PATH.
      - name: Select compatible Gradle version
        if: steps.toolchain.outputs.use_wrapper == 'false'
        shell: bash
        run: |
          set -euo pipefail
          REQUIRED=$(python3 - <<'PY'
          import json, re
          t = json.load(open('toolchain.json', encoding='utf-8'))
          selected = str(t.get('gradle_version') or '8.9')
          agp = str(t.get('agp_version') or '')
          match = re.match(r'^(\d+)\.(\d+)', agp)
          family = f'{match.group(1)}.{match.group(2)}' if match else ''
          minimum = {
              '8.0': '8.0', '8.1': '8.0', '8.2': '8.2.1',
              '8.3': '8.4', '8.4': '8.6', '8.5': '8.7',
              '8.6': '8.7', '8.7': '8.9', '8.8': '8.10.2',
              '8.9': '8.11.1', '8.10': '8.11.1',
              '8.11': '8.13', '8.12': '8.13',
          }.get(family)
          def parts(v):
              return tuple(int(n) for n in re.findall(r'\d+', v)[:3])
          if minimum and parts(selected) < parts(minimum):
              selected = minimum
          print(selected)
          PY
          )
          CURRENT=$(gradle --version | awk '/^Gradle / {print $2; exit}')
          echo "Detected AGP: ${{ steps.toolchain.outputs.agp_version }}"
          echo "Required Gradle: $REQUIRED; installed system Gradle: $CURRENT"
          if [ "$REQUIRED" != "$CURRENT" ]; then
            TARGET="/opt/gradle-$REQUIRED"
            if [ ! -x "$TARGET/bin/gradle" ]; then
              echo "Downloading Gradle $REQUIRED from services.gradle.org"
              curl --fail --location --retry 3 --silent --show-error \
                "https://services.gradle.org/distributions/gradle-${REQUIRED}-bin.zip" \
                --output /tmp/androidforge-gradle.zip
              unzip -q /tmp/androidforge-gradle.zip -d /opt
              rm -f /tmp/androidforge-gradle.zip
            fi
            test -x "$TARGET/bin/gradle"
            echo "$TARGET/bin" >> "$GITHUB_PATH"
            export PATH="$TARGET/bin:$PATH"
          fi
          gradle --version | head -3

      - name: Build project
        id: build
        continue-on-error: true
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/build_project.py" \
            --root "${{ steps.extract.outputs.project_root }}" \
            --detect "$GITHUB_WORKSPACE/detection.json" \
            --toolchain "$GITHUB_WORKSPACE/toolchain.json" \
            --variant "${{ inputs.build_variant || 'auto' }}" \
            --log-dir "$GITHUB_WORKSPACE/.androidforge/logs" \
            --output "$GITHUB_WORKSPACE/build.json" || true
          if [ ! -f "$GITHUB_WORKSPACE/build.json" ]; then
            echo '{"build_succeeded": false, "successful_command": null, "exit_code": -1, "log_file": null}' > "$GITHUB_WORKSPACE/build.json"
          fi
          cat "$GITHUB_WORKSPACE/build.json"

      - name: Collect APKs
        id: collect
        if: always()
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/collect_apk.py" \
            --root "${{ steps.extract.outputs.project_root }}" \
            --variant "${{ inputs.build_variant || 'auto' }}" \
            --output-dir "$GITHUB_WORKSPACE/output" \
            --output-json "$GITHUB_WORKSPACE/collect.json" || true
          if [ ! -f "$GITHUB_WORKSPACE/collect.json" ]; then
            echo '{"apk_count": 0, "primary": null, "all_apks": []}' > "$GITHUB_WORKSPACE/collect.json"
          fi
          cat "$GITHUB_WORKSPACE/collect.json"

      - name: Upload APK artifact
        if: steps.collect.outputs.apk_count != '0' && steps.collect.outputs.apk_count != ''
        uses: actions/upload-artifact@v4
        with:
          name: AndroidForge-APKs
          path: ${{ steps.collect.outputs.apk_directory }}/*.apk
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 0

      - name: Upload AAB artifact
        if: steps.collect.outputs.apk_count != '0' && steps.collect.outputs.apk_count != ''
        uses: actions/upload-artifact@v4
        with:
          name: AndroidForge-AAB
          path: ${{ steps.collect.outputs.apk_directory }}/*.aab
          if-no-files-found: ignore
          retention-days: 30

      # The Pages UI expects the APK in release web-build-output-<run ID>.
      - name: Publish APKs to output release
        if: always() && steps.collect.outputs.apk_count != '0' && steps.collect.outputs.apk_count != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="web-build-output-${{ github.run_id }}"
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer $GH_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"
          VERSION="X-GitHub-Api-Version: 2022-11-28"
          BODY="{\"tag_name\":\"$TAG\",\"target_commitish\":\"main\",\"name\":\"Build #${{ github.run_number }} output\",\"body\":\"AndroidForge APK output\",\"prerelease\":true}"
          RELEASE=$(curl -fsS -X POST -H "$AUTH" -H "$ACCEPT" -H "$VERSION" \
            -H 'Content-Type: application/json' -d "$BODY" "$API/releases" || true)
          ID=$(printf '%s' "$RELEASE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))' 2>/dev/null || true)
          if [ -z "$ID" ]; then
            RELEASE=$(curl -fsS -H "$AUTH" -H "$ACCEPT" -H "$VERSION" "$API/releases/tags/$TAG")
            ID=$(printf '%s' "$RELEASE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))')
          fi
          test -n "$ID"
          shopt -s nullglob
          COUNT=0
          for f in "$GITHUB_WORKSPACE"/output/*.apk "$GITHUB_WORKSPACE"/output/*.aab; do
            [ -f "$f" ] || continue
            NAME=$(basename "$f")
            echo "Uploading $NAME to release $TAG"
            CODE=$(curl -sS -X POST -H "$AUTH" -H "$ACCEPT" -H "$VERSION" \
              -H 'Content-Type: application/octet-stream' --data-binary "@$f" \
              -o /tmp/androidforge-asset-response.json -w '%{http_code}' \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=$NAME")
            if [ "$CODE" != "201" ] && [ "$CODE" != "200" ]; then
              echo "::error::Failed to publish $NAME: HTTP $CODE"
              cat /tmp/androidforge-asset-response.json
              exit 1
            fi
            COUNT=$((COUNT + 1))
          done
          echo "output_release_tag=$TAG" >> "$GITHUB_ENV"
          {
            echo "## AndroidForge output"
            echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo "Uploaded files: $COUNT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidForge-logs
          path: |
            .androidforge/logs/
            ${{ steps.extract.outputs.project_root }}/build/outputs/
            ${{ steps.extract.outputs.project_root }}/**/build/reports/
            ${{ steps.extract.outputs.project_root }}/**/build/outputs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Diagnose failure
        if: steps.build.outputs.build_succeeded != 'true'
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/diagnose_failure.py" \
            --root "${{ steps.extract.outputs.project_root }}" \
            --log-dir "$GITHUB_WORKSPACE/.androidforge/logs" || true

      - name: Build summary
        if: always()
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/build_summary.py" \
            --detect "$GITHUB_WORKSPACE/detection.json" \
            --toolchain "$GITHUB_WORKSPACE/toolchain.json" \
            --build "$GITHUB_WORKSPACE/build.json" \
            --collect "$GITHUB_WORKSPACE/collect.json" || true
          if [ -f "$GITHUB_WORKSPACE/self_heal.json" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Self-heal report" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$GITHUB_WORKSPACE/self_heal.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if build failed
        if: steps.build.outputs.build_succeeded != 'true'
        run: |
          echo '::error::Android build failed; see AndroidForge-logs and build summary.'
          exit 1
